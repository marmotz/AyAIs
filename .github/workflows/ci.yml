name: 'CI Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install macOS dependencies
        run: |
          brew install gnu-tar coreutils
          echo "Homebrew dependencies installed"

      - name: Install Dependencies
        run: npm ci && npm i -D cli-truncate iconv-corefoundation

      - name: Install Playwright Browsers
        run: npx playwright@1.57.0 install --with-deps

      - name: Run headless unit test
        run: npm run test -- --reporters=default

      - name: Run headless e2e test
        run: npm run test:e2e

  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright@1.57.0 install --with-deps

      - name: Run headless unit test
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm run test -- --reporters=default

      - name: Run headless e2e test
        uses: GabrielBB/xvfb-action@v1
        with:
          run: npm run test:e2e

  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Cache Node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright@1.57.0 install --with-deps

      - name: Run headless unit test
        run: npm run test -- --reporters=default

      - name: Run headless e2e test
        run: npm run test:e2e
