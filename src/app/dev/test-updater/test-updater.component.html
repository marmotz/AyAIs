<div class="mx-auto flex h-full w-full max-w-2xl items-center p-4">
  <p-card
    header="Auto-Updater Test Panel"
    styleClass="w-full max-w-2xl"
  >
    <div class="flex flex-col gap-4">
      <div class="text-surface-600 dark:text-surface-400 text-sm">
        <p class="mb-2 font-semibold">Current Status:</p>
        <p class="font-mono text-lg">{{ autoUpdateService.updateStatus() }}</p>
      </div>

      <div class="flex flex-col gap-2">
        <p-button
          (onClick)="simulateUpdateAvailable()"
          label="Simulate Update Available"
          outlined="true"
          severity="info"
        />
      </div>

      <div class="text-surface-500 dark:text-surface-600 mt-4 text-xs">
        <p class="mb-1 font-semibold">Note:</p>
        <p>This panel simulates auto-update events for development testing.</p>
        <p>For real testing, build the app and publish releases.</p>
      </div>

      <p-button
        (onClick)="goBack()"
        icon="pi pi-arrow-left"
        label="Back to Dev Tools"
        outlined="true"
        severity="secondary"
      >
        <fa-icon [icon]="['fas', 'arrow-left']" />
      </p-button>
    </div>
  </p-card>
</div>
