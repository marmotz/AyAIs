<p-dialog
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [style]="{ width: '40rem' }"
  [visible]="visible()"
  closeOnEscape
  dismissableMask
>
  <ng-template pTemplate="header">
    <h2 class="m-0 text-xl font-semibold">Add AI Service</h2>
  </ng-template>
  <ng-template pTemplate="content">
    <div class="grid grid-cols-2 gap-2">
      @for (service of availableServices; track service.name) {
        <button
          (click)="addService(service)"
          class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 bg-white p-3 transition-colors duration-200 hover:bg-slate-100 focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700"
        >
          <img
            [alt]="service.name"
            [src]="service.icon"
            class="size-8 shrink-0"
          />
          <span class="truncate text-sm font-medium text-slate-800 dark:text-slate-200">{{ service.name }}</span>
        </button>
      }
    </div>
  </ng-template>
</p-dialog>
