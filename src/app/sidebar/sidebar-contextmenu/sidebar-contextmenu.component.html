<p-contextmenu
  #contextMenu
  [model]="menuItems"
>
  <ng-template
    #item
    let-item
  >
    <a class="flex cursor-pointer items-center px-4 py-3">
      @if (item.icon) {
        <fa-icon [icon]="item.icon.split(' ')" />
      }
      <span class="ml-2">{{ item.label }}</span>
    </a>
  </ng-template>
</p-contextmenu>
