<div
  class="box-border flex h-screen w-22 flex-col bg-linear-to-r from-blue-50 to-blue-100 dark:from-blue-950 dark:to-blue-900"
>
  <div
    class="flex flex-col items-center rounded-b-xl border-blue-300 bg-radial from-blue-100 via-blue-100 to-blue-300 pb-2 shadow-lg dark:border-blue-700 dark:from-blue-900 dark:via-blue-900 dark:to-blue-700"
  >
    <img
      alt="Logo"
      class="size-16"
      src="assets/icons/png/64x64.png"
    />
    <div
      class="w-full cursor-default text-center text-xl font-bold text-slate-600 dark:text-slate-300"
      id="logo"
    >
      AyAIs
    </div>
  </div>
  <nav
    (cdkDropListDropped)="onServiceDropped($event)"
    cdkDropList
    class="flex min-h-0 flex-1 flex-col gap-3 pt-3"
  >
    <div
      class="relative flex flex-col overflow-y-auto px-3"
      id="providers"
    >
      @for (provider of configuredServices(); track provider.id; let i = $index) {
        <button
          (click)="onServiceClick(provider)"
          (contextmenu)="onServiceContextMenu($event, provider)"
          [attr.data-testid]="'sidebar-button-' + provider.id"
          [title]="getServiceTitle(provider, i)"
          cdkDrag
          class="group relative size-16 cursor-pointer rounded-2xl border-none p-2 text-white transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
        >
          @if (getService(provider); as service) {
            <img
              [alt]="displayNames().get(provider.id) ?? service.name"
              [class.grayscale]="selectedService()?.id !== provider.id"
              [class.opacity-50]="selectedService()?.id !== provider.id"
              [src]="service.icon"
              class="size-12 group-hover:opacity-100 group-hover:grayscale-0"
            />
          }
        </button>
      }

      @if (isAiServicesRoute() && selectedIndex() !== -1) {
        <div
          [style.top.px]="selectedIndex() * 64"
          class="pointer-events-none absolute left-21 h-16 w-1 rounded bg-slate-500 transition-all duration-500 dark:bg-slate-300"
          id="serviceMark"
        ></div>
      }
    </div>

    <div class="px-3">
      <button
        (click)="openAddServiceDialog()"
        class="group relative size-16 cursor-pointer rounded-2xl border-2 border-dashed border-slate-400 p-2 text-slate-400 transition-colors duration-200 hover:border-slate-600 hover:text-slate-600 focus:outline-none dark:border-slate-500 dark:text-slate-500 dark:hover:border-slate-300 dark:hover:text-slate-300"
        data-testid="sidebar-button-add-provider"
        title="Add provider"
      >
        <fa-icon
          [icon]="['fas', 'plus']"
          class="text-2xl"
        />
      </button>
    </div>
  </nav>

  <div class="mb-3 flex w-full flex-col items-center gap-3">
    <button
      (click)="openWhatsNew()"
      class="group relative size-12 cursor-pointer rounded-2xl border-none p-2 transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
      data-testid="sidebar-button-whatsnew"
      title="What's new"
    >
      <img
        alt="What's new"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/whatsnew.svg"
      />
    </button>

    <button
      (click)="isAiServicesRoute() ? openSettings() : openAiServices()"
      [title]="getSettingsTitle()"
      class="group relative mt-auto size-12 cursor-pointer rounded-2xl border-none p-2 transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
      data-testid="sidebar-button-settings"
    >
      <img
        alt="Settings"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/settings.svg"
      />
    </button>

    <button
      (click)="quitApp()"
      [title]="getQuitTitle()"
      class="group relative size-12 cursor-pointer rounded-2xl border-none p-2 text-white transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
      data-testid="sidebar-button-quit"
    >
      <img
        alt="Quit"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/exit.svg"
      />
    </button>

    @if (isSettingsRoute()) {
      <div
        class="absolute h-10 w-1 translate-x-10 translate-y-16 rounded bg-slate-500 text-sm whitespace-nowrap text-white dark:bg-slate-300"
      ></div>
    }
  </div>

  <app-sidebar-contextmenu
    (serviceRefresh)="onContextMenuRefresh()"
    (serviceRemove)="onContextMenuRemove()"
  />

  <app-sidebar-whatsnew-dialog />

  <app-sidebar-add-service-dialog
    [(visible)]="addServiceDialogVisible"
    (serviceAdded)="addService($event)"
  />
</div>
