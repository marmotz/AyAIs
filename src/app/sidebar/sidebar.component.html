<div
  class="box-border flex h-screen w-22 flex-col bg-linear-to-r from-blue-50 to-blue-100 dark:from-blue-950 dark:to-blue-900"
>
  <div
    class="flex flex-col items-center rounded-b-xl border-blue-300 bg-radial from-blue-100 via-blue-100 to-blue-300 pb-2 shadow-lg dark:border-blue-700 dark:from-blue-900 dark:via-blue-900 dark:to-blue-700"
  >
    <img
      alt="Logo"
      class="size-16"
      src="assets/icons/png/64x64.png"
    />
    <div
      class="w-full cursor-default text-center text-xl font-bold text-slate-600 dark:text-slate-300"
      id="logo"
    >
      AyAIs
    </div>
  </div>
  <nav class="flex flex-1 flex-col gap-3 p-3">
    @for (service of services; track service.name; let i = $index) {
      <button
        (click)="onServiceClick(service)"
        [title]="getServiceTitle(service, i)"
        class="group relative size-16 cursor-pointer rounded-2xl border-none p-2 text-white transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
      >
        <img
          [alt]="service.name"
          [class.grayscale]="selectedService()?.name !== service.name"
          [class.opacity-50]="selectedService()?.name !== service.name"
          [src]="service.icon"
          class="size-12 group-hover:opacity-100 group-hover:grayscale-0"
        />
      </button>
    }

    @if (isAiServicesRoute() && selectedIndex() !== -1) {
      <div
        [style]="{
          transform: `translateY(calc(var(--spacing) * 19 * ${selectedIndex()})`,
        }"
        class="absolute h-16 w-1 translate-x-18 rounded bg-slate-500 text-sm whitespace-nowrap transition-transform duration-500 dark:bg-slate-300"
      ></div>
    }
  </nav>

  <div class="mb-3 flex w-full flex-col items-center gap-3">
    <button
      (click)="openWhatsNew()"
      class="group relative size-12 cursor-pointer rounded-2xl border-none p-2 transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
      title="What's new"
    >
      <img
        alt="What's new"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/whatsnew.svg"
      />
    </button>

    <button
      (click)="isAiServicesRoute() ? openSettings() : openAiServices()"
      [title]="getSettingsTitle()"
      class="group relative mt-auto size-12 cursor-pointer rounded-2xl border-none p-2 transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
    >
      <img
        alt="Settings"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/settings.svg"
      />
    </button>

    <button
      (click)="quitApp()"
      [title]="getQuitTitle()"
      class="group relative size-12 cursor-pointer rounded-2xl border-none p-2 text-white transition-colors duration-200 hover:bg-slate-500/10 focus:outline-none"
    >
      <img
        alt="Quit"
        class="size-8 group-hover:opacity-100"
        src="assets/icons/exit.svg"
      />
    </button>

    @if (isSettingsRoute()) {
      <div
        class="absolute h-10 w-1 translate-x-10 translate-y-16 rounded bg-slate-500 text-sm whitespace-nowrap text-white dark:bg-slate-300"
      ></div>
    }
  </div>

  <p-dialog
    (visibleChange)="whatsNewVisible.set($event)"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [visible]="whatsNewVisible()"
    closeOnEscape
    dismissableMask
  >
    <ng-template pTemplate="header">
      <h2 class="m-0 text-xl font-semibold">What's new ?</h2>
    </ng-template>
    <ng-template pTemplate="content">
      <app-whatsnew />
    </ng-template>
  </p-dialog>
</div>
